name: changelog-check

on:
  pull_request:
    branches: [main]
    paths:
      - 'clash-shockwaves/**'
      - 'surfer-shockwaves/**'

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to diff properly

      - name: Check for changelog entry
        run: |
          # Compare PR branch against main
          BASE_REF="origin/${{ github.base_ref }}"

          git fetch origin "${{ github.base_ref }}"

          # List added/removed/modified files in changelog directory
          changelog_diff=$(git diff --name-status "$BASE_REF"...HEAD | grep '^[A|D|M]\s\+changelog/' || true)

          if [ -z "$changelog_diff" ]; then
            echo "::warning title=Missing changelog entry::No new file added to changelog/"
            exit 1
          else
            echo "Changelog entries found:"
            echo "$added"
          fi

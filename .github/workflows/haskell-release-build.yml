name: '> haskell-release-build'

on:
  push:
    tags:
      - 'v**'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.14.2.0'
      - name: Check cabal file
        run: |
          cd $GITHUB_WORKSPACE/clash-shockwaves
          cp ../CHANGELOG.md CHANGELOG.md
          ghc --version
          cabal check
      - name: Compile library to docs
        if: '!cancelled()'
        run: |
          cd $GITHUB_WORKSPACE/clash-shockwaves
          cabal haddock --builddir ./hackage-dist --haddock-for-hackage --enable-doc --minimize-conflict-set
      - name: Make library tarball
        if: '!cancelled()'
        run: |
          cd $GITHUB_WORKSPACE/clash-shockwaves
          cabal sdist
      - name: Upload Haddock docs
        uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: Haddock docs
          path: clash-shockwaves/hackage-dist/clash-shockwaves*.tar.gz
          if-no-files-found: error
      - name: Upload Hackage tarball
        uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: Tarball for Hackage
          path: clash-shockwaves/dist-newstyle/sdist/clash-shockwaves*.tar.gz
          if-no-files-found: error
      - name: Upload Haddock docs to release
        uses: Roang-zero1/github-upload-release-artifacts-action@v2
        with:
          args: "clash-shockwaves/hackage-dist/clash-shockwaves*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Hackage tarball to release
        uses: Roang-zero1/github-upload-release-artifacts-action@v2
        with:
          args: "clash-shockwaves/dist-newstyle/sdist/clash-shockwaves*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
